<div id="ambiguous-gif-review">
  <style>
    #ambiguous-gif-review {
      display: grid;
      gap: 1rem;
      color: var(--foreground);
    }

    #ambiguous-gif-review .review-heading {
      display: grid;
      gap: 0.35rem;
    }

    #ambiguous-gif-review .gif-choice {
      display: grid;
      gap: 0.5rem;
      align-content: start;
    }

    #ambiguous-gif-review .exercise-gif {
      display: block;
      width: min(100%, 180px);
      aspect-ratio: 1;
      object-fit: contain;
      margin-inline: auto;
      background: var(--muted);
    }

    #ambiguous-gif-review .choice-label {
      display: grid;
      gap: 0.15rem;
    }

    #ambiguous-gif-review .review-actions {
      justify-content: space-between;
    }

    #ambiguous-gif-review .review-feedback {
      min-height: 1.25rem;
    }
  </style>

  <div class="viz-controls">
    <label class="form-label" for="gif-case-select">
      Ejercicio
      <select id="gif-case-select" class="form-select"></select>
    </label>
    <span id="gif-case-counter" class="text-small text-muted" aria-live="polite"></span>
  </div>

  <section class="card" aria-labelledby="gif-case-title">
    <div class="review-heading">
      <h3 id="gif-case-title"></h3>
      <div id="gif-case-evidence" class="text-small text-muted"></div>
    </div>
    <fieldset>
      <legend class="sr-only">Selecciona el GIF que corresponde al ejercicio</legend>
      <div id="gif-candidates" class="viz-grid"></div>
      <label class="form-check">
        <input id="gif-none" class="form-check-input" type="radio" name="gif-candidate" value="none">
        <span class="form-check-label">Ninguno coincide</span>
      </label>
    </fieldset>
  </section>

  <div class="viz-row review-actions">
    <div class="viz-row">
      <button id="gif-prev" class="btn" type="button">Anterior</button>
      <button id="gif-next" class="btn" type="button">Siguiente</button>
    </div>
    <button id="gif-send" class="btn btn-primary" type="button">Enviar elecciones</button>
  </div>
  <div id="gif-feedback" class="review-feedback text-small text-muted" aria-live="polite"></div>

gBoUI2Q7KEFSEBAAOw==' }
          ]
        }
      ];

      const select = root.querySelector('#gif-case-select');
      const counter = root.querySelector('#gif-case-counter');
      const title = root.querySelector('#gif-case-title');
      const evidence = root.querySelector('#gif-case-evidence');
      const candidates = root.querySelector('#gif-candidates');
      const none = root.querySelector('#gif-none');
      const previous = root.querySelector('#gif-prev');
      const next = root.querySelector('#gif-next');
      const send = root.querySelector('#gif-send');
      const feedback = root.querySelector('#gif-feedback');
      const selections = Object.fromEntries(cases.map(item => [item.id, item.recommended || '']));
      let activeIndex = 0;

      cases.forEach((item, index) => {
        const option = document.createElement('option');
        option.value = String(index);
        option.textContent = `${index + 1}. ${item.exercise}`;
        select.appendChild(option);
      });

      function render() {
        const item = cases[activeIndex];
        select.value = String(activeIndex);
        counter.textContent = `Caso ${activeIndex + 1} de ${cases.length}`;
        title.textContent = item.exercise;
        evidence.textContent = item.evidence;
        candidates.replaceChildren();

        item.candidates.forEach(candidate => {
          const label = document.createElement('label');
          label.className = 'gif-choice';

          const image = document.createElement('img');
          image.className = 'exercise-gif';
          image.src = candidate.src;
          image.alt = `${candidate.label}: ${candidate.dataset}`;

          const check = document.createElement('span');
          check.className = 'form-check choice-label';

          const input = document.createElement('input');
          input.className = 'form-check-input';
          input.type = 'radio';
          input.name = 'gif-candidate';
          input.value = candidate.id;
          input.checked = selections[item.id] === candidate.id;
          input.addEventListener('change', () => {
            selections[item.id] = candidate.id;
            feedback.textContent = `Elegido: ${candidate.label}`;
          });

          const text = document.createElement('span');
          text.className = 'form-check-label';
          text.textContent = candidate.label;

          const dataset = document.createElement('code');
          dataset.textContent = `${candidate.id} · ${candidate.dataset}`;

          check.append(input, text, dataset);
          label.append(image, check);
          candidates.appendChild(label);
        });

        none.checked = selections[item.id] === 'none';
        previous.disabled = activeIndex === 0;
        next.disabled = activeIndex === cases.length - 1;
        feedback.textContent = selections[item.id] ? 'Elección guardada.' : 'Pendiente de elegir.';
      }

      select.addEventListener('change', () => {
        activeIndex = Number(select.value);
        render();
      });

      previous.addEventListener('click', () => {
        activeIndex = Math.max(0, activeIndex - 1);
        render();
      });

      next.addEventListener('click', () => {
        activeIndex = Math.min(cases.length - 1, activeIndex + 1);
        render();
      });

      none.addEventListener('change', () => {
        if (none.checked) {
          selections[cases[activeIndex].id] = 'none';
          feedback.textContent = 'Marcado: ninguno coincide.';
        }
      });

      send.addEventListener('click', async () => {
        const lines = cases.map(item => {
          const selected = selections[item.id];
          const match = item.candidates.find(candidate => candidate.id === selected);
          return `- ${item.exercise}: ${selected === 'none' ? 'ninguno coincide' : match ? `${match.label} (dataset ${match.id})` : 'pendiente'}`;
        });
        const prompt = `Estas son mis elecciones para los GIF ambiguos del plan de definición:\n${lines.join('\n')}\nRevisa mis elecciones antes de modificar archivos.`;

        if (window.openai?.sendFollowUpMessage) {
          await window.openai.sendFollowUpMessage({ prompt, title: 'Revisar elecciones de GIF' });
        } else {
          feedback.textContent = lines.join(' | ');
        }
      });

      render();
    })();
  </script>
